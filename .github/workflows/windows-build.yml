name: Windows build (portable)

on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - 'src/**'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - '.github/workflows/windows-build.yml'

concurrency:
  group: windows-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build portable openttd.exe
    runs-on: windows-latest
    # Hard cap per run: without this, a hung vcpkg/build step can consume up to
    # the 6h default and drain the account's included Actions minutes in one run.
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Cache vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: |
          build/vcpkg_installed
          ${{ runner.tool_cache }}/vcpkg
        key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-x64-windows-static-

    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure
      shell: bash
      run: |
        mkdir build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"

    - name: Build
      shell: bash
      run: cmake --build build

    - name: Package (exe + lang + baseset)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force package | Out-Null
        Copy-Item build/openttd.exe package/
        Copy-Item -Recurse build/lang package/
        Copy-Item -Recurse build/baseset package/
        curl.exe -L https://cdn.openttd.org/opengfx-releases/0.6.0/opengfx-0.6.0-all.zip -o opengfx.zip
        Expand-Archive -Path opengfx.zip -DestinationPath package/baseset -Force
        curl.exe -L https://cdn.openttd.org/opensfx-releases/1.0.3/opensfx-1.0.3-all.zip -o opensfx.zip
        Expand-Archive -Path opensfx.zip -DestinationPath package/baseset -Force
        curl.exe -L https://cdn.openttd.org/openmsx-releases/0.4.2/openmsx-0.4.2-all.zip -o openmsx.zip
        Expand-Archive -Path openmsx.zip -DestinationPath package/baseset -Force
        Compress-Archive -Path package -DestinationPath openttd3d-windows.zip

    - name: Create versioned pre-release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        LAST=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^v0\.0\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
        if [ -z "$LAST" ]; then V="0.0.1"; else V=$(echo "$LAST" | awk -F. '{print $1"."$2"."$3+1}'); fi
        echo "Version: v$V"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "v$V"
        git push origin "v$V"
        NOTES="Pre-alpha build of the 3D orbit renderer. Commit: $(git rev-parse --short HEAD)"
        gh release create "v$V" openttd3d-windows.zip --title "v$V" --notes "$NOTES" --prerelease

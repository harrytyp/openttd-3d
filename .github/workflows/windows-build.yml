name: Windows build (portable)

on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - 'src/**'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - '.github/workflows/windows-build.yml'

jobs:
  windows:
    name: Build portable openttd.exe
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure
      shell: bash
      run: |
        mkdir build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"

    - name: Build
      shell: bash
      run: cmake --build build

    - name: Package (exe + lang + baseset)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force package | Out-Null
        Copy-Item build/openttd.exe package/
        Copy-Item -Recurse build/lang package/
        Copy-Item -Recurse build/baseset package/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openttd3d-windows
        path: package
        retention-days: 14

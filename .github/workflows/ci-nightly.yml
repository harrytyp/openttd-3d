name: CI - Nightly

on:
  # Weekly (Sunday 03:00 UTC) instead of daily: macOS/MinGW jobs bill at 10x/2x
  # on this private repo, and a daily schedule alone exceeded the Free-plan
  # monthly quota, which took ALL workflows in the repo down.
  schedule:
  - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          full_arch: x86_64

    name: Mac OS (${{ matrix.arch }})

    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

    with:
      arch: ${{ matrix.arch }}
      full_arch: ${{ matrix.full_arch }}

  mingw:
    strategy:
      fail-fast: false
      matrix:
        include:
        - msystem: UCRT64
          arch: x86_64

    name: MinGW (${{ matrix.arch }})

    uses: ./.github/workflows/ci-mingw.yml
    secrets: inherit

    with:
      msystem: ${{ matrix.msystem }}
      arch: ${{ matrix.arch }}

  check_annotations:
    name: Check Annotations
    needs:
    - macos
    - mingw

    if: always()

    runs-on: ubuntu-latest

    steps:
    - name: Check annotations
      uses: OpenTTD/actions/annotation-check@v6
